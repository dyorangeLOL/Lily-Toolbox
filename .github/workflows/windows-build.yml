name: Windows desktop build and smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --features toolbox-desktop/spike-web,toolbox-desktop/core-validation -- -D warnings
      - run: cargo test --locked --workspace
      - run: pnpm desktop:build
      - name: Real WebView2 frontend / IPC / close / reopen
        shell: pwsh
        run: ./tools/dev-scripts/windows-smoke.ps1 -Executable ./target/release/toolbox-desktop.exe
      - name: Record repeated-launch startup samples
        shell: pwsh
        run: ./tools/benchmarks/shell-baseline.ps1 -Executable ./target/release/toolbox-desktop.exe
      - name: Preserve normal binary and compile standalone core probe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts/wf03-bin | Out-Null
          Copy-Item -LiteralPath target/release/toolbox-desktop.exe -Destination .artifacts/wf03-bin/toolbox-desktop.exe
          cargo build --release --locked -p toolbox-core --example wf03_probe
      - name: Compile explicit WF-02 / WF-03 validation features
        run: |
          cargo build --release --locked -p toolbox-desktop --features spike-web,core-validation
      - name: Real child WebView / shared-environment Profiles / Portable experiment
        shell: pwsh
        run: ./tools/spikes/windows-gate-a.ps1 -Executable ./target/release/toolbox-desktop.exe -OutputDirectory .artifacts/wf02-control -SkipPerformance
      - name: Real core SQLite / readonly / local JS IPC and reopen
        shell: pwsh
        run: ./tools/dev-scripts/wf03-windows.ps1 -ProbeExecutable ./target/release/examples/wf03_probe.exe -DesktopExecutable ./target/release/toolbox-desktop.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wf03-windows-x64
          # The allowlist below contains binaries and sanitized reports only.
          # Include the .artifacts parent; never upload UDF or database folders.
          include-hidden-files: true
          path: |
            target/release/toolbox-desktop.exe
            target/release/examples/wf03_probe.exe
            .artifacts/wf03-bin/toolbox-desktop.exe
            .artifacts/wf03-windows/summary.json
            .artifacts/wf03-windows/core.json
            .artifacts/wf03-windows/readonly.json
            .artifacts/wf03-windows/ipc-*.json
            .artifacts/windows-smoke/
            .artifacts/shell-baseline/
            .artifacts/wf02-control/*-native.json
            .artifacts/wf02-control/*-events.json
            .artifacts/wf02-control/gate-a-evidence.json
          if-no-files-found: warn

name: Windows desktop build and smoke
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows-x64:
    runs-on: windows-2025
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-msvc
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo clippy --locked --workspace --all-targets --features toolbox-desktop/spike-web -- -D warnings
      - run: cargo test --locked --workspace
      - run: pnpm desktop:build
      - name: Real WebView2 frontend / IPC / close / reopen
        shell: pwsh
        run: ./tools/dev-scripts/windows-smoke.ps1 -Executable ./target/release/toolbox-desktop.exe
      - name: Record repeated-launch startup samples
        shell: pwsh
        run: ./tools/benchmarks/shell-baseline.ps1 -Executable ./target/release/toolbox-desktop.exe
      - name: Compile explicit WF-02 experiment
        run: |
          cargo build --release --locked -p toolbox-desktop --features spike-web
      - name: Real child WebView / shared-environment Profiles / Portable experiment
        shell: pwsh
        run: ./tools/spikes/windows-gate-a.ps1 -Executable ./target/release/toolbox-desktop.exe -OutputDirectory .artifacts/wf02-control -SkipPerformance
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wf02-windows-x64
          path: |
            target/release/toolbox-desktop.exe
            .artifacts/windows-smoke/
            .artifacts/shell-baseline/
            .artifacts/wf02-control/*-native.json
            .artifacts/wf02-control/*-events.json
            .artifacts/wf02-control/gate-a-evidence.json
          if-no-files-found: warn

name: Common checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  frontend-and-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: node --test tools/spikes/fixture-server.test.mjs
      - run: pnpm build
      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked -p toolbox-core --all-targets -- -D warnings
      - run: cargo test --locked -p toolbox-core
